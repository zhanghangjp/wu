<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弥弥的专属活动</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
        body{background:linear-gradient(135deg,#ffd6e8,#e0c3fc);min-height:100vh;padding:40px 15px;text-align:center;}
        .pwd-box,.container{max-width:440px;margin:0 auto;background:rgba(255,255,255,0.88);padding:40px 28px;border-radius:24px;box-shadow:0 6px 20px rgba(180,120,200,0.25);backdrop-filter:blur(6px);}
        .pwd-box{padding:60px 30px;border-radius:28px;}
        .hide{display:none!important;}
        h1{color:#9146b8;font-size:26px;margin-bottom:28px;letter-spacing:2px;}
        h1::before,h1::after{content:"♡";margin:0 10px;color:#ff7eb9;}
        .pwd-title{font-size:28px;color:#c44793;margin-bottom:12px;}
        .pwd-slogan{font-size:16px;color:#885599;margin-bottom:35px;line-height:28px;}
        .info-text{font-size:16px;color:#663377;margin:14px 0;line-height:26px;}
        .info-text span{color:#d64893;font-weight:bold;}
        .btn{width:100%;padding:16px;border:none;border-radius:50px;font-size:18px;font-weight:bold;margin:14px 0;cursor:pointer;transition:0.3s ease;-webkit-tap-highlight-color:transparent;pointer-events:auto;}
        #enterBtn{background:linear-gradient(90deg,#ff7eb9,#ff66a8);color:#fff;}
        #signBtn{background:linear-gradient(90deg,#b888e8,#da88d8);color:#fff;}
        #lotteryBtn{background:linear-gradient(90deg,#ff7eb9,#ff66a8);color:#fff;}
        #freeLotteryBtn{background:#ff6090;color:#fff;padding:14px;border-radius:50px;border:none;font-size:17px;margin:8px 0;width:100%;}
        .task-btn{background:#f0c8e0;color:#9146b8;padding:14px 10px;font-size:16px;}
        .task-btn:disabled{background:#eee;color:#bbb;cursor:not-allowed;transform:none;}
        .btn:disabled{background:#d8c8ee!important;cursor:not-allowed;transform:none!important;}
        #freeLotteryBtn:disabled{background:#ffc0d0;color:#fff;}
        .btn:active:not(:disabled){transform:scale(0.97);}
        /* 抽奖弹窗 */
        .lottery-pop{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.65);z-index:998;display:none;align-items:center;justify-content:center;}
        .lottery-inner{width:85%;max-width:360px;background:#fff0f8;border-radius:22px;padding:40px 20px;}
        #lotteryPopText{font-size:26px;color:#c44793;font-weight:bold;min-height:40px;line-height:40px;}
        .result-area{margin-top:28px;padding:22px;border:1px solid #e8c8f0;border-radius:20px;min-height:100px;font-size:17px;color:#772266;line-height:30px;background:rgba(255,240,250,0.6);}
        .rule-desc,.task-box{margin-top:24px;font-size:14px;color:#774488;text-align:left;line-height:26px;padding:16px;background:rgba(240,220,255,0.5);border-radius:16px;}
        .record-box{margin-top:30px;font-size:14px;padding:18px 16px;background:#fff0f8;border-radius:20px;border:1px solid #f2c8e2;text-align:left;}
        .task-box h3,.record-box h3{text-align:center;color:#c44793;margin-bottom:15px;font-size:18px;}
        .task-item{margin:12px 0;display:flex;flex-direction:column;gap:10px;}
        .task-tip{text-align:center;font-size:13px;color:#c44793;}
        .count-num{font-size:22px;color:#ff4477;font-weight:bold;}
        .rule-desc strong{color:#c44793;}
        input{width:100%;padding:15px;border:1px solid #e8c8f0;border-radius:50px;font-size:18px;outline:none;text-align:center;margin-bottom:15px;background:#fff8fc;color:#333;caret-color:#c44793;}
        input::placeholder{color:#bb88bb;}
        .tip{color:#ff4477;margin-top:10px;font-size:15px;}
        .loading{opacity:0.6;pointer-events:none;}
        .record-header{display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:2px solid #f2d8e8;margin-bottom:10px;font-weight:bold;color:#a05890;}
        .record-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eecfe0;}
        .record-prize{color:#772266;}
        .record-time{font-size:12px;color:#b078a2;min-width:110px;text-align:right;}
        .empty-record{text-align:center;padding:20px 0;color:#c898bb;}
        /* 彩蛋弹窗 */
        .egg-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:999;display:none;align-items:center;justify-content:center;}
        .egg-box{background:#fff0f8;padding:40px 30px;border-radius:24px;text-align:center;max-width:360px;animation:eggPop 0.6s ease;}
        @keyframes eggPop{0%{transform:scale(0.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
        .egg-title{font-size:24px;color:#c44793;margin-bottom:15px;}
        .egg-text{font-size:16px;color:#772266;line-height:28px;}
        /* 烟花画布 */
        #fireCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9999;pointer-events:none;display:none;}
        /* 爱情语录 */
        .quote-box{margin:24px 0;padding:16px;background:#fff0f8;border-radius:18px;border:1px solid #ffc8e0;}
        .quote-title{font-size:17px;color:#c44793;margin-bottom:12px;}
        #quoteText{font-size:15px;color:#666;min-height:36px;line-height:36px;margin-bottom:8px;}
        #quoteRemain{font-size:14px;color:#ff7096;margin-bottom:12px;}
        #getQuoteBtn{background:#ff98bb;color:#fff;padding:12px;border-radius:30px;border:none;font-size:15px;width:60%;cursor:pointer;}
        /* 贪吃蛇弹窗 */
        .snake-pop{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;overflow-y:auto;}
        .snake-wrap{background:#fff;border-radius:16px;padding:16px;}
        #snakeCanvas{border:2px solid #ffb8d0;background:#fff9fb;}
        .snake-diff-box{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0;}
        .diff-btn{padding:8px 12px;border:none;border-radius:8px;color:#fff;}
        .diff-s{background:#7fc97f;}
        .diff-m{background:#386cb0;}
        .diff-h{background:#fdc086;}
        .diff-p{background:#be4242;}
        .snake-tip{color:#fff;font-size:14px;}
        .close-snake{padding:8px 20px;border:none;border-radius:8px;background:#ff88aa;color:#fff;}
        /* 虚拟方向按键 */
        .virtual-key{display:grid;grid-template-columns:60px 60px 60px;grid-template-rows:60px 60px;gap:6px;margin:10px 0;}
        .vk{width:60px;height:60px;border-radius:12px;border:none;font-size:22px;color:#fff;background:#ff88aa;pointer-events:auto;}
        .vk-empty{background:transparent;border:none;}
        /* 贪吃蛇任务模块 */
        .snake-task-box{margin:24px 0;padding:16px;background:#fff0f8;border-radius:18px;border:1px solid #ffc8e0;}
        .snake-task-title{font-size:17px;color:#c44793;margin-bottom:12px;}
        .snake-desc{font-size:14px;color:#666;margin-bottom:10px;line-height:24px;}
        .snake-state{font-size:14px;margin:6px 0;}
        .openSnakeBtn{background:#ff88aa;color:#fff;padding:12px;border-radius:30px;border:none;font-size:15px;width:60%;cursor:pointer;}
        /* 通关夸奖弹窗 */
        .pass-pop{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:1100;display:none;align-items:center;justify-content:center;}
        .pass-box{background:#fff0f8;width:82%;max-width:340px;border-radius:20px;padding:30px 20px;text-align:center;}
        .pass-word{font-size:28px;color:#be4242;font-weight:900;line-height:1.6;margin-bottom:16px;}
        .pass-reward{font-size:18px;color:#386cb0;font-weight:bold;margin-bottom:24px;}
        .pass-confirm{padding:10px 32px;border:none;border-radius:30px;background:#ff88aa;color:#fff;font-size:16px;}
    </style>
</head>
<body>
    <!-- 贪吃蛇弹窗 -->
    <div class="snake-pop" id="snakePop">
        <div class="snake-tip">简单吃到10个食物通关｜普通/困难/炼狱吃到15个通关｜炼狱红色陷阱碰即失败</div>
        <div class="snake-diff-box">
            <button class="diff-btn diff-s" id="diffS">简单(+1次抽奖)</button>
            <button class="diff-btn diff-m" id="diffM" disabled>普通(+2次抽奖)</button>
            <button class="diff-btn diff-h" id="diffH" disabled>困难(+5次抽奖)</button>
            <button class="diff-btn diff-p" id="diffP" disabled>炼狱(+5次抽奖)</button>
        </div>
        <div class="snake-wrap">
            <canvas id="snakeCanvas" width="280" height="280"></canvas>
        </div>
        <!-- 虚拟模拟键盘 -->
        <div class="virtual-key">
            <div></div>
            <button class="vk" id="vkUp">↑</button>
            <div></div>
            <button class="vk" id="vkLeft">←</button>
            <button class="vk vk-empty"></button>
            <button class="vk" id="vkRight">→</button>
            <div></div>
            <button class="vk" id="vkDown">↓</button>
            <div></div>
        </div>
        <button class="close-snake" id="closeSnake">关闭小游戏</button>
    </div>
    <!-- 通关夸奖弹窗 -->
    <div class="pass-pop" id="passPop">
        <div class="pass-box">
            <div class="pass-word" id="passWord"></div>
            <div class="pass-reward" id="passReward"></div>
            <button class="pass-confirm" id="passConfirm">收下奖励</button>
        </div>
    </div>
    <!-- 抽奖全屏弹窗 -->
    <div class="lottery-pop" id="lotteryPop">
        <div class="lottery-inner">
            <div id="lotteryPopText">正在抽奖...</div>
        </div>
    </div>
    <!-- 烟花画布 -->
    <canvas id="fireCanvas"></canvas>
    <!-- 彩蛋弹窗 -->
    <div class="egg-mask" id="eggMask">
        <div class="egg-box">
            <div class="egg-title">💌 专属彩蛋</div>
            <div class="egg-text">欢迎来到弥弥和航航的小世界<br>往后岁岁年年，永远相伴亲亲♡</div>
        </div>
    </div>

    <!-- 登录区域 -->
    <div class="pwd-box" id="pwdWrap">
        <div class="pwd-title">♡ 致弥弥的专属小世界 ♡</div>
        <div class="pwd-slogan">愿弥弥日日开心，岁岁欢喜<br>所有温柔惊喜，只为你一人准备</div>
        <input type="password" id="pwdInput" placeholder="输入专属密码解锁浪漫惊喜">
        <button class="btn" id="enterBtn">💌 奔赴属于弥弥的好运</button>
        <div class="tip" id="pwdTip"></div>
    </div>

    <div class="container hide" id="mainWrap">
        <h1>弥弥的专属活动</h1>
        <div class="info-text">
            <p>今日签到状态：<span id="signStatus">加载中...</span></p>
            <p>累计签到总次数：<span id="totalSign">-</span>次</p>
            <p>剩余抽奖次数：<span id="lotteryNum">-</span>次</p>
        </div>
        <button class="btn" id="signBtn">💌 今日签到领取抽奖机会</button>
        <button id="freeLotteryBtn">🎁 领取今日免费1次抽奖</button>
        <button class="btn" id="lotteryBtn" disabled>🎀 开启浪漫抽奖</button>

        <!-- 贪吃蛇闯关任务 -->
        <div class="snake-task-box">
            <div class="snake-task-title">🐍 贪吃蛇闯关任务</div>
            <div class="snake-desc">难度顺序：简单→普通→困难→炼狱，不可跳关<br>通关规则：简单10个食物｜普通/困难/炼狱15个食物<br>奖励：简单+1｜普通+2｜困难+5｜炼狱+5｜炼狱专属红色陷阱</div>
            <div class="snake-state" id="snakeState">今日可从简单开始闯关</div>
            <button class="openSnakeBtn" id="openSnakeBtn">打开贪吃蛇</button>
        </div>

        <!-- 每日爱情语录 -->
        <div class="quote-box">
            <div class="quote-title">💖 今日爱情语录</div>
            <div id="quoteText">点击下方按钮获取专属情话</div>
            <div id="quoteRemain">今日剩余抽取次数：5次</div>
            <button id="getQuoteBtn">抽取今日情话</button>
        </div>

        <div class="task-box">
            <h3>📋 甜蜜每日任务</h3>
            <div class="task-item">
                <button class="btn task-btn" id="taskKiss">💋 弥弥亲航航30秒</button>
                <div class="task-tip">倒计时：<span class="count-num" id="kissCount">0</span> s</div>
                <div class="task-tip">静静等待弥弥亲航航三十秒，结束领取1次抽奖机会</div>
            </div>
        </div>

        <div class="result-area" id="resultBox">正在同步弥弥的好运数据...</div>

        <div class="rule-desc">
            <strong>💖 专属奖品清单</strong><br>
            1.一等奖：价值400元等价商品（中奖概率1.5%）<br>
            2.二等奖：50元话费（中奖概率8.5%）<br>
            3.其余奖项：再接再厉（中奖概率90%）<br><br>
            <strong>活动规则：</strong><br>
            1.每日0点自动重置全部当日状态；累计签到总数、抽奖记录永久保存不丢失；<br>
            2.每日福利：免费领1次抽奖；语录每日最多抽5次；签到/亲亲任务各得1次；贪吃蛇通关领取对应次数；<br>
            3.贪吃蛇必须从简单依次解锁，简单吃到10个通关，普通/困难/炼狱吃到15个通关，每日每档仅可领取一次；炼狱有红色陷阱；支持屏幕虚拟按键游玩；<br>
            温馨寄语：坚持每日签到抽奖，20天内大概率收获惊喜好礼！
        </div>

        <div class="record-box">
            <h3>📜 弥弥全部抽奖记录</h3>
            <div class="record-header">
                <span>中奖奖品</span>
                <span>抽奖时间</span>
            </div>
            <div id="recordList"></div>
        </div>
    </div>

<script>
    const correctPwd = "521";
    const storage = window.localStorage;
    const prizeArr = [
        "一等奖：价值400元等价商品 🎉",
        "二等奖：50元话费 💕",
        "再接再厉",
        "一等奖：价值400元等价商品 🎉",
        "再接再厉",
        "二等奖：50元话费 💕"
    ];
    const loveQuoteList = [
        "弥弥，余生我只偏爱你一人",
        "岁岁年年，航航伴弥弥朝夕",
        "满心欢喜，全部都给弥弥",
        "有弥弥在，每天皆是温柔",
        "航航的全世界，只有弥弥",
        "朝暮与年岁，我与弥弥同行",
        "万事皆无趣，唯弥弥是欢喜",
        "守着弥弥，便是一生圆满",
        "目光所及，满心皆是弥弥",
        "此生所愿，与弥弥共白头",
        "偏爱和温柔，全都给弥弥",
        "遇见弥弥，才算不负此生",
        "漫漫余生，航航守护弥弥",
        "心之所向，永远是弥弥",
        "四季轮回，我只钟情弥弥"
    ];
    const MAX_QUOTE_TIMES = 5;
    // 霸道夸奖文案库
    const praiseList = [
        "弥弥也太厉害了，在我心里永远第一名！",
        "不愧是我的弥弥，这点小事轻轻松松拿下！",
        "谁都比不上我的弥弥，操作直接碾压全场！",
        "我的小姑娘真棒，不管什么关卡都难不倒你！",
        "弥弥天赋拉满，果然什么游戏都能轻松通关！",
        "也就只有我的弥弥能这么厉害，我太骄傲了！",
        "弥弥实力天花板，所有难度通通拿捏住！",
        "不用怀疑，我的弥弥永远最耀眼最厉害！",
        "别人费劲都过不去，弥弥随手就通关，太酷了！",
        "我的宝贝弥弥超牛，在我这里永远闪闪发光！"
    ];
    // 难度配置：单独设置通关分数
    const DIFF_CONFIG = {
        s: {speed:180, reward:1, next:"m", trap:false, target:10},
        m: {speed:120, reward:2, next:"h", trap:false, target:15},
        h: {speed:75, reward:5, next:"p", trap:false, target:15},
        p: {speed:45, reward:5, next:"", trap:true, target:15}
    };

    const els = {
        pwdWrap: document.getElementById('pwdWrap'),
        mainWrap: document.getElementById('mainWrap'),
        pwdInput: document.getElementById('pwdInput'),
        enterBtn: document.getElementById('enterBtn'),
        pwdTip: document.getElementById('pwdTip'),
        signStatus: document.getElementById('signStatus'),
        totalSign: document.getElementById('totalSign'),
        lotteryNum: document.getElementById('lotteryNum'),
        signBtn: document.getElementById('signBtn'),
        lotteryBtn: document.getElementById('lotteryBtn'),
        freeLotteryBtn: document.getElementById('freeLotteryBtn'),
        resultBox: document.getElementById('resultBox'),
        taskKiss: document.getElementById('taskKiss'),
        kissCount: document.getElementById('kissCount'),
        recordList: document.getElementById('recordList'),
        eggMask: document.getElementById('eggMask'),
        fireCanvas: document.getElementById('fireCanvas'),
        quoteText: document.getElementById('quoteText'),
        quoteRemain: document.getElementById('quoteRemain'),
        getQuoteBtn: document.getElementById('getQuoteBtn'),
        lotteryPop: document.getElementById('lotteryPop'),
        lotteryPopText: document.getElementById('lotteryPopText'),
        // 贪吃蛇
        snakePop: document.getElementById('snakePop'),
        snakeCanvas: document.getElementById('snakeCanvas'),
        closeSnake: document.getElementById('closeSnake'),
        openSnakeBtn: document.getElementById('openSnakeBtn'),
        snakeState: document.getElementById('snakeState'),
        diffS: document.getElementById('diffS'),
        diffM: document.getElementById('diffM'),
        diffH: document.getElementById('diffH'),
        diffP: document.getElementById('diffP'),
        // 虚拟按键
        vkUp: document.getElementById('vkUp'),
        vkDown: document.getElementById('vkDown'),
        vkLeft: document.getElementById('vkLeft'),
        vkRight: document.getElementById('vkRight'),
        // 通关弹窗
        passPop: document.getElementById('passPop'),
        passWord: document.getElementById('passWord'),
        passReward: document.getElementById('passReward'),
        passConfirm: document.getElementById('passConfirm')
    };

    // 时间工具
    function getNowDate(){return new Date();}
    function getTodayStr(){
        const d = getNowDate();
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,'0');
        const day = String(d.getDate()).padStart(2,'0');
        return `${y}-${m}-${day}`;
    }
    function formatFullTime(){
        const d = getNowDate();
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,'0');
        const day = String(d.getDate()).padStart(2,'0');
        const h = String(d.getHours()).padStart(2,'0');
        const min = String(d.getMinutes()).padStart(2,'0');
        return `${y}-${m}-${day} ${h}:${min}`;
    }
    // 每日重置
    function resetDailyData(){
        userData.sign_date = "";
        userData.task_kiss = false;
        userData.task_kiss_date = "";
        userData.quote_date = "";
        userData.quote_count = 0;
        userData.today_quote = "";
        userData.free_lottery_date = "";
        userData.snake_today = getTodayStr();
        userData.snake_clear = {s:false,m:false,h:false,p:false};
        storage.setItem('mimi_data', JSON.stringify(userData));
        renderPage();
        els.resultBox.innerText = "✅ 零点自动刷新，今日可重新签到、领免费抽奖、做任务、抽情话、闯关贪吃蛇！累计签到、抽奖记录全部保留";
    }
    // 跨天检测定时器
    let dayCheckTimer;
    function startDayAutoCheck(){
        dayCheckTimer = setInterval(()=>{
            const today = getTodayStr();
            const signCross = userData.sign_date && userData.sign_date !== today;
            const taskCross = userData.task_kiss_date && userData.task_kiss_date !== today;
            const quoteCross = userData.quote_date && userData.quote_date !== today;
            const freeCross = userData.free_lottery_date && userData.free_lottery_date !== today;
            const snakeCross = userData.snake_today !== today;
            if(signCross||taskCross||quoteCross||freeCross||snakeCross) resetDailyData();
        },60000);
    }

    // 烟花
    const canvas = els.fireCanvas;
    const ctx = canvas.getContext('2d');
    let w,h,fireList=[],particleList=[],fireTimer=null,animTimer=null;
    const fireColors = ['#ff7eb9','#ffb8d0','#e8a8f0','#ffd0e8','#fff'];
    function resizeCanvas(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
    resizeCanvas();
    window.addEventListener('resize',resizeCanvas);
    class Fire{
        constructor(){
            this.x=Math.random()*w;this.y=h;
            this.targetY=h*0.12+Math.random()*h*0.32;
            this.speed=5+Math.random()*4;this.color=fireColors[Math.floor(Math.random()*fireColors.length)];
            this.radius=2.5;this.burst=false;
        }
        update(){
            this.y-=this.speed;
            if(this.y<=this.targetY&&!this.burst){this.burst=true;createBigBurst(this.x,this.y,this.color);}
        }
        draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fillStyle=this.color;ctx.fill();}
    }
    class Particle{
        constructor(x,y,color){
            this.x=x;this.y=y;this.color=color;
            const angle=Math.random()*Math.PI*2;
            const speed=3+Math.random()*4;
            this.vx=Math.cos(angle)*speed;this.vy=Math.sin(angle)*speed;
            this.alpha=1;this.radius=2+Math.random()*2;this.gravity=0.04;this.fadeSpeed=0.022;
        }
        update(){
            this.x+=this.vx;
            this.y+=this.vy;
            this.vy+=this.gravity;
            this.vx*=0.98;
            this.alpha-=this.fadeSpeed;
        }
        draw(){ctx.save();ctx.globalAlpha=this.alpha;ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fillStyle=this.color;ctx.fill();ctx.restore();}
    }
    function createBigBurst(x,y,color){
        const count=90+Math.floor(Math.random()*60);
        for(let i=0;i<count;i++) particleList.push(new Particle(x,y,color));
    }
    function renderFire(){
        ctx.clearRect(0,0,w,h);
        for(let i=fireList.length-1;i>=0;i--){fireList[i].update();fireList[i].draw();if(fireList[i].burst) fireList.splice(i,1);}
        for(let i=particleList.length-1;i>=0;i--){particleList[i].update();particleList[i].draw();if(particleList[i].alpha<=0) particleList.splice(i,1);}
    }
    function startFireWork(){
        canvas.style.display = 'block';
        fireTimer = setInterval(()=>fireList.push(new Fire()),220);
        function loop(){renderFire();animTimer = requestAnimationFrame(loop);}
        loop();
    }
    function stopFireWork(){
        clearInterval(fireTimer);cancelAnimationFrame(animTimer);
        setTimeout(()=>{canvas.style.display='none';fireList=[];particleList=[];},2800);
    }

    // ===================== 贪吃蛇游戏逻辑（完全不动） =====================
    let snakeCtx = null;
    let snakeTimer = null;
    let snakeData = {
        dir:"right",nextDir:"right",body:[{x:4,y:4}],food:{x:10,y:10},traps:[],score:0,diff:"s",size:14
    };
    function resetSnake(){
        const cfg = DIFF_CONFIG[snakeData.diff];
        snakeData = {
            dir:"right",nextDir:"right",body:[{x:4,y:4}],food:getRandomPos(),traps: cfg.trap ? genTraps() : [],score:0,speed:cfg.speed,diff:snakeData.diff,size:14
        };
    }
    function getRandomPos(){
        return {x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};
    }
    function genTraps(){
        const arr=[];for(let i=0;i<6;i++) arr.push(getRandomPos());return arr;
    }
    function drawSnake(){
        snakeCtx.clearRect(0,0,280,280);
        const s=snakeData.size;
        snakeCtx.fillStyle="#c82423";
        snakeData.traps.forEach(t=>snakeCtx.fillRect(t.x*s,t.y*s,s-1,s-1));
        snakeCtx.fillStyle="#ff6090";
        snakeCtx.fillRect(snakeData.food.x*s,snakeData.food.y*s,s-1,s-1);
        snakeCtx.fillStyle="#7fc97f";
        snakeData.body.forEach(seg=>snakeCtx.fillRect(seg.x*s,seg.y*s,s-1,s-1));
    }
    function snakeLoop(){
        snakeData.dir = snakeData.nextDir;
        const head = {...snakeData.body[0]};
        if(snakeData.dir==="up") head.y--;
        if(snakeData.dir==="down") head.y++;
        if(snakeData.dir==="left") head.x--;
        if(snakeData.dir==="right") head.x++;
        // 撞墙
        if(head.x<0||head.x>=20||head.y<0||head.y>=20){
            clearInterval(snakeTimer);alert("撞墙失败，重新闯关");resetSnake();startSnakeGame();return;
        }
        // 撞自身
        for(let seg of snakeData.body){
            if(seg.x===head.x&&seg.y===head.y){
                clearInterval(snakeTimer);alert("撞到自己，闯关失败");resetSnake();startSnakeGame();return;
            }
        }
        // 撞陷阱
        for(let trap of snakeData.traps){
            if(trap.x===head.x&&trap.y===head.y){
                clearInterval(snakeTimer);alert("踩到红色陷阱，闯关失败！");resetSnake();startSnakeGame();return;
            }
        }
        snakeData.body.unshift(head);
        // 吃到食物
        if(head.x===snakeData.food.x&&head.y===snakeData.food.y){
            snakeData.score++;
            snakeData.food = getRandomPos();
            const target = DIFF_CONFIG[snakeData.diff].target;
            if(snakeData.score >= target){
                clearInterval(snakeTimer);
                const diffKey = snakeData.diff;
                const reward = DIFF_CONFIG[diffKey].reward;
                const randomPraise = praiseList[Math.floor(Math.random()*praiseList.length)];
                if(!userData.snake_clear[diffKey]){
                    userData.snake_clear[diffKey] = true;
                    userData.lottery_count += reward;
                    storage.setItem('mimi_data', JSON.stringify(userData));
                    els.passWord.innerText = randomPraise;
                    els.passReward.innerText = `通关成功！吃到${snakeData.score}个食物，领取${reward}次抽奖`;
                    els.passPop.style.display = "flex";
                }else{
                    els.resultBox.innerText = "今日该难度已领取过奖励";
                }
                renderPage();
                return;
            }
        }else{
            snakeData.body.pop();
        }
        drawSnake();
    }
    function startSnakeGame(){
        clearInterval(snakeTimer);drawSnake();
        snakeTimer = setInterval(snakeLoop, snakeData.speed);
    }
    // 高灵敏键盘
    document.addEventListener("keydown",e=>{
        if(!els.snakePop.style.display||els.snakePop.style.display==="none") return;
        if(e.key==="ArrowUp"&&snakeData.dir!=="down") snakeData.nextDir="up";
        if(e.key==="ArrowDown"&&snakeData.dir!=="up") snakeData.nextDir="down";
        if(e.key==="ArrowLeft"&&snakeData.dir!=="right") snakeData.nextDir="left";
        if(e.key==="ArrowRight"&&snakeData.dir!=="left") snakeData.nextDir="right";
        e.preventDefault();
    });
    // 虚拟按键
    els.vkUp.onclick = ()=>{if(snakeData.dir!=="down") snakeData.nextDir="up";};
    els.vkDown.onclick = ()=>{if(snakeData.dir!=="up") snakeData.nextDir="down";};
    els.vkLeft.onclick = ()=>{if(snakeData.dir!=="right") snakeData.nextDir="left";};
    els.vkRight.onclick = ()=>{if(snakeData.dir!=="left") snakeData.nextDir="right";};
    // 难度切换
    els.diffS.onclick = ()=>{snakeData.diff="s";resetSnake();startSnakeGame();};
    els.diffM.onclick = ()=>{snakeData.diff="m";resetSnake();startSnakeGame();};
    els.diffH.onclick = ()=>{snakeData.diff="h";resetSnake();startSnakeGame();};
    els.diffP.onclick = ()=>{snakeData.diff="p";resetSnake();startSnakeGame();};
    // 弹窗开关
    els.openSnakeBtn.onclick = ()=>{els.snakePop.style.display="flex";snakeCtx=els.snakeCanvas.getContext("2d");resetSnake();startSnakeGame();};
    els.closeSnake.onclick = ()=>{clearInterval(snakeTimer);els.snakePop.style.display="none";};
    // 关闭通关弹窗
    els.passConfirm.onclick = ()=>{els.passPop.style.display = "none";};

    // 数据初始化
    function getUserData() {
        const data = storage.getItem('mimi_data');
        const defaultData = {
            sign_date: "",total_sign_count:0,lottery_count:0,task_kiss:false,task_kiss_date:"",
            quote_date:"",quote_count:0,today_quote:"",free_lottery_date:"",
            snake_today:getTodayStr(),snake_clear:{s:false,m:false,h:false,p:false},lotteryRecords:[]
        };
        if (!data) return defaultData;
        let parseData;
        try{parseData=JSON.parse(data);}catch(e){return defaultData;}
        for(let key in defaultData){if(!parseData.hasOwnProperty(key)) parseData[key]=defaultData[key];}
        return parseData;
    }
    let userData = getUserData();
    startDayAutoCheck();

    // ========== 修复密码验证核心（独立、无阻塞、不改动上方业务） ==========
    function doLogin(){
        const inputVal = els.pwdInput.value.trim();
        els.pwdTip.innerText = "";
        if(inputVal === correctPwd){
            // 密码正确流程
            els.eggMask.style.display = "flex";
            setTimeout(() => {
                els.eggMask.style.display = "none";
                startFireWork();
                setTimeout(() => {
                    stopFireWork();
                    els.pwdWrap.classList.add('hide');
                    els.mainWrap.classList.remove('hide');
                    renderPage();
                },2800);
            }, 1800);
        }else{
            els.pwdTip.innerText = "密码错误，请输入521";
        }
    }
    // 点击登录按钮触发校验
    els.enterBtn.onclick = function(){
        doLogin();
    };
    // 输入框回车直接校验
    els.pwdInput.addEventListener('keydown',function(e){
        if(e.key === 'Enter'){
            doLogin();
        }
    });

    // 每日免费抽奖领取
    els.freeLotteryBtn.onclick = function(){
        const today = getTodayStr();
        if(userData.free_lottery_date === today){
            els.resultBox.innerText = "今日免费抽奖次数已经领取过啦，明天再来！";
            return;
        }
        userData.free_lottery_date = today;
        userData.lottery_count += 1;
        storage.setItem('mimi_data', JSON.stringify(userData));
        els.resultBox.innerText = "🎁 成功领取今日免费1次抽奖次数！";
        renderPage();
    };

    // 抽取爱情语录
    els.getQuoteBtn.addEventListener('click', function(){
        const today = getTodayStr();
        if(userData.quote_date !== today){userData.quote_date = today;userData.quote_count = 0;}
        if(userData.quote_count >= MAX_QUOTE_TIMES){els.quoteText.innerText="今日5次抽取次数已用完，明天再来吧";return;}
        const randomIndex = Math.floor(Math.random() * loveQuoteList.length);
        const pickQuote = loveQuoteList[randomIndex];
        userData.today_quote = pickQuote;
        userData.quote_count += 1;
        storage.setItem('mimi_data', JSON.stringify(userData));
        els.quoteText.innerText = pickQuote;
        renderPage();
    });

    // 渲染抽奖记录
    function renderRecord() {
        const list = userData.lotteryRecords;
        if(list.length === 0) {
            els.recordList.innerHTML = "<div class='empty-record'>暂无抽奖记录，快去抽取属于你的好运♡</div>";
            return;
        }
        let html = "";
        for(let i = list.length - 1; i >= 0; i--) {
            const item = list[i];
            html += `
                <div class="record-item">
                    <div class="record-prize">${item.prize}</div>
                    <div class="record-time">${item.time}</div>
                </div>
            `;
        }
        els.recordList.innerHTML = html;
    }

    // 页面渲染刷新状态
    function renderPage() {
        const today = getTodayStr();
        const isSignToday = userData.sign_date === today;
        const isTaskDoneToday = userData.task_kiss && userData.task_kiss_date === today;
        const getFreeDone = userData.free_lottery_date === today;
        const sClear = userData.snake_clear.s;
        const mClear = userData.snake_clear.m;
        const hClear = userData.snake_clear.h;
        const pClear = userData.snake_clear.p;

        // 难度解锁控制
        els.diffM.disabled = !sClear;
        els.diffH.disabled = !mClear;
        els.diffP.disabled = !hClear;
        // 闯关提示文字
        let snakeText = "";
        if(!sClear) snakeText = "今日可从【简单】开始闯关，吃到10个食物通关解锁普通";
        else if(!mClear) snakeText = "简单已通关，可挑战【普通】（吃到15个通关）";
        else if(!hClear) snakeText = "普通已通关，可挑战【困难】（吃到15个通关）";
        else if(!pClear) snakeText = "困难已通关，可挑战【炼狱】（吃到15个通关，有红色陷阱）";
        else snakeText = "今日全部难度已通关，明天再来";
        els.snakeState.innerText = snakeText;

        // 语录剩余次数
        let remainQuote = MAX_QUOTE_TIMES;
        if(userData.quote_date === today){
            remainQuote = MAX_QUOTE_TIMES - userData.quote_count;
        }
        els.quoteRemain.innerText = `今日剩余抽取次数：${remainQuote}次`;
        els.getQuoteBtn.disabled = remainQuote <= 0;

        els.signStatus.innerText = isSignToday ? "已签到 ♡" : "未签到";
        els.totalSign.innerText = userData.total_sign_count;
        els.lotteryNum.innerText = userData.lottery_count;
        els.signBtn.disabled = isSignToday;
        els.taskKiss.disabled = isTaskDoneToday;
        els.freeLotteryBtn.disabled = getFreeDone;
        els.kissCount.innerText = "0";
        els.lotteryBtn.disabled = userData.lottery_count <= 0;

        if (isSignToday) {
            els.resultBox.innerText = "签到成功！专属好运已送达，快去抽取惊喜吧♡";
        } else {
            els.resultBox.innerText = "属于弥弥的好运正在等候，签到即可开启抽奖～";
        }
        renderRecord();
    }

    // 签到任务
    els.signBtn.onclick = () => {
        els.signBtn.classList.add('loading');
        const today = getTodayStr();
        userData.sign_date = today;
        userData.total_sign_count += 1;
        userData.lottery_count += 1;
        storage.setItem('mimi_data', JSON.stringify(userData));
        setTimeout(() => {
            els.signBtn.classList.remove('loading');
            els.resultBox.innerText = "签到成功！专属好运已送达，快去抽取惊喜吧♡";
            renderPage();
        }, 300);
    };

    // 30秒亲亲任务
    els.taskKiss.onclick = () => {
        const today = getTodayStr();
        if(userData.task_kiss && userData.task_kiss_date === today) return;
        let second = 0;
        els.taskKiss.disabled = true;
        els.taskKiss.innerText = "弥弥在亲航航中";
        const timer = setInterval(() => {
            second++;
            els.kissCount.innerText = second;
            if(second >= 30){
                clearInterval(timer);
                userData.task_kiss = true;
                userData.task_kiss_date = getTodayStr();
                userData.lottery_count += 1;
                storage.setItem('mimi_data', JSON.stringify(userData));
                els.taskKiss.innerText = "今日亲亲任务已完成";
                els.resultBox.innerText = "弥弥亲完航航啦！额外获得1次抽奖次数♡";
                renderPage();
            }
        }, 1000);
    };

    // 抽奖弹窗逻辑（已修正概率）
    els.lotteryBtn.onclick = () => {
        if (userData.lottery_count <= 0) return;
        els.lotteryBtn.classList.add('loading');
        els.lotteryBtn.disabled = true;
        els.lotteryPop.style.display = "flex";
        let rollIndex = 0;
        const rollTimer = setInterval(() => {
            els.lotteryPopText.innerText = prizeArr[rollIndex % prizeArr.length];
            rollIndex++;
        }, 120);
        setTimeout(() => {
            clearInterval(rollTimer);
            userData.lottery_count -= 1;
            const rand = Math.random() * 100;
            let finalPrize = "再接再厉";
            // 概率区间：一等奖1.5%，二等奖8.5%，合计10%，剩余90%安慰奖
            if (rand <= 1.5) {
                finalPrize = "一等奖：价值400元等价商品 🎉";
            } else if (rand <= 10) {
                finalPrize = "二等奖：50元话费 💕";
            }
            els.lotteryPopText.innerText = finalPrize;
            const timeStr = formatFullTime();
            userData.lotteryRecords.push({prize:finalPrize, time:timeStr});
            storage.setItem('mimi_data', JSON.stringify(userData));
            setTimeout(()=>{
                els.lotteryPop.style.display = "none";
                els.lotteryBtn.classList.remove('loading');
                els.resultBox.innerHTML = `💐恭喜弥弥抽到：<strong>${finalPrize}</strong>`;
                renderPage();
            },1200);
        }, 1800);
    };

    renderPage();
</script>
</body>
</html>
